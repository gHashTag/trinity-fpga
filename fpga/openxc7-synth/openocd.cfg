# OpenOCD config for Xilinx Artix-7 via FTDI
# Cable PID: 0x0013 (IMPORTANT!)
adapter driver ftdi
adapter speed 1000
ftdi_vid_pid 0x03fd 0x0013
reset_config none
transport select jtag

# AX7203 XC7A200T JTAG tap (IDCODE 0x13636093, ver-0 variant 0x03636093)
jtag newtap xc7a200t tap -irlen 6 -expected-id 0x13636093 -expected-id 0x03636093
target create xc7a200t.cpu testee -chain-position xc7a200t.tap

init
pld load 0 /work/quantum_bridge_violation.bit
shutdown
