# OpenOCD for Xilinx Artix-7 via FTDI
adapter driver ftdi
ftdi vid 0x03fd
ftdi pid 0x0013
ftdi channel 0
reset_config none
transport select jtag

# Create JTAG tap chain for the AX7203 XC7A200T (IDCODE 0x13636093, ver-0 variant 0x03636093)
jtag newtap xc7a200t tap -irlen 6 -expected-id 0x13636093 -expected-id 0x03636093

# Create target
target create xc7a200t.cpu testee -chain-position xc7a200t.tap

# Initialize JTAG
init

# Load bitstream via Xilinx FPGA programming
pld load 0 /work/quantum_bridge_violation.bit

# Shutdown
shutdown
