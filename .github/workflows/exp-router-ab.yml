# Experiment for #850, not a gate. router1 vs router2 under HeAP, on the eight conformance designs
# the #862 placer A/B measured (round 1: run 37213406352, round 2: run 37215621928), on the 4-CPU
# hosted runners those workflows actually use.
#
# Why: on Railway (24 CPUs of quota) the dayo64 xcheck design spent ~90% of nextpnr in Router1
# (21.1 s) and router2 did the same job in 3.3 s, Fmax -2.2%, peak RSS 5.5x. router2 is this
# nextpnr's default; 50 workflows override it with --router router1. Whether that holds on small
# designs on small runners is what this measures: s/seed, the router's own timer, post-route Fmax,
# peak RSS, and whether router2 routes every seed router1 routes.
#
# Fmax is taken from the "Max frequency" lines AFTER the last "Routing complete." line. Older
# router2 builds printed only placer1's pre-route estimate (tnf-format-throughput.yml, W936); in
# this image router2 is followed by a router1 legality pass that prints a post-route report.
# fmax_postroute=false on a seed line means that report was missing and the figure is not used.
#
# Positive control: the router1 rows must reproduce round 2's heap rows on seeds 1-8 (all clean,
# same Fmax ranges for gf6/gf8/gf16_mul, gf16_codec and gf24_sub).
name: router1/router2 A/B under HeAP on the conformance designs (experiment, #850)
on:
  push:
    branches: [exp/router-ab]
    paths: ['.github/workflows/exp-router-ab.yml']
env:
  IMG: regymm/openxc7@sha256:35c910739e3a4b40850b85de31ebc8954985a66e982009f09123b70dbb0e75da
  PART: xc7a200tfbg484-2
  CHIPDB_KEY: chipdb-exp850-35c91073-xc7a200tfbg484-2-v1
jobs:
  chipdb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: build/chipdb/xc7a200tfbg484-2.bin
          key: ${{ env.CHIPDB_KEY }}
      - name: Build chipdb
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull -q "$IMG" && break
            sleep $((i*20))
          done
          mkdir -p build/chipdb
          docker run --rm -v "$PWD:/work" -w /work "$IMG" bash -c "cd /nextpnr-xilinx && python3 xilinx/python/bbaexport.py --device $PART --bba /work/build/chipdb/$PART.bba && bbasm -l /work/build/chipdb/$PART.bba /work/build/chipdb/$PART.bin"
          rm -f "build/chipdb/$PART.bba"
          ls -l build/chipdb

  ab:
    needs: chipdb
    name: ${{ matrix.design }} ${{ matrix.router }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        design: [gf6_mul, gf8_mul, gf16_mul, gf16_codec, gf24_sub, gf12_clean, gf14_add, gf14_sub]
        router: [router1, router2]
        # Sources, extra synth flags and xdc copied from each workflow on main.
        include:
          - {design: gf6_mul, srcs: fpga/openxc7-synth/gf_mul_param.v fpga/vivado/gf6_mul_ax7203.v, synth_extra: -nodsp, xdc: gf16_clean_ax7203.xdc}
          - {design: gf8_mul, srcs: fpga/openxc7-synth/gf_mul_param.v fpga/vivado/gf8_mul_ax7203.v, synth_extra: -nodsp, xdc: gf16_clean_ax7203.xdc}
          - {design: gf16_mul, srcs: fpga/openxc7-synth/gf_mul_param.v fpga/vivado/gf16_mul_ax7203.v, synth_extra: -nodsp, xdc: gf16_clean_ax7203.xdc}
          - {design: gf16_codec, srcs: fpga/vivado/gf16_codec_ax7203.v fpga/openxc7-synth/gf16_adder.v, synth_extra: '', xdc: gf16_ax7203.xdc}
          - {design: gf24_sub, srcs: fpga/openxc7-synth/gf_adder_param.v fpga/vivado/gf24_sub_ax7203.v, synth_extra: '', xdc: gf16_clean_ax7203.xdc}
          - {design: gf12_clean, srcs: fpga/openxc7-synth/gf_adder_param.v fpga/vivado/gf12_clean_ax7203.v, synth_extra: '', xdc: gf16_clean_ax7203.xdc}
          - {design: gf14_add, srcs: fpga/openxc7-synth/gf_adder_param.v fpga/vivado/gf14_add_ax7203.v, synth_extra: '', xdc: gf16_clean_ax7203.xdc}
          - {design: gf14_sub, srcs: fpga/openxc7-synth/gf_adder_param.v fpga/vivado/gf14_sub_ax7203.v, synth_extra: '', xdc: gf16_clean_ax7203.xdc}
    env:
      DESIGN: ${{ matrix.design }}
      TOP: ${{ matrix.design }}_ax7203
      SRCS: ${{ matrix.srcs }}
      SYNTH_EXTRA: ${{ matrix.synth_extra }}
      XDC: ${{ matrix.xdc }}
      ROUTER: ${{ matrix.router }}
      SEEDS: '1 2 3 4 5 6 7 8'
      OUT: build/${{ matrix.design }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull image
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull -q "$IMG" && break
            sleep $((i*20))
          done
          have_image=false; docker image inspect "$IMG" >/dev/null 2>&1 && have_image=true
          if [ "$have_image" = false ]; then echo "::error::cannot pull $IMG"; exit 1; fi
          echo "nproc=$(nproc) mem=$(free -m | awk '/Mem:/{print $2}')MB"

      - id: chipdb
        uses: actions/cache/restore@v4
        with:
          path: build/chipdb/xc7a200tfbg484-2.bin
          key: ${{ env.CHIPDB_KEY }}
          fail-on-cache-miss: true

      - name: Yosys
        shell: bash
        run: |
          mkdir -p "$OUT"
          docker run --rm -v "$PWD:/work" -w /work "$IMG" yosys -p "
            read_verilog $SRCS;
            synth_xilinx -flatten -abc9 -nocarry $SYNTH_EXTRA -arch xc7 -top $TOP;
            setundef -zero -params; write_json $OUT/$TOP.json" > /tmp/yosys.log 2>&1
          abc_assert=false; grep -q "Assertion .* failed" /tmp/yosys.log && abc_assert=true
          json_written=false; [ -f "$OUT/$TOP.json" ] && json_written=true
          echo "abc_assert=$abc_assert json_written=$json_written"
          echo "### $DESIGN, heap / $ROUTER" >> "$GITHUB_STEP_SUMMARY"
          if [ "$json_written" = false ]; then tail -n 40 /tmp/yosys.log; echo "::error::yosys wrote no json"; exit 1; fi

      - name: nextpnr, every seed
        shell: bash
        run: |
          # Peak RSS of nextpnr itself, measured inside the container by the image's own python3.
          RSS_WRAP='import resource, subprocess, sys; rc = subprocess.call(sys.argv[1:]); print("maxrss_kb=%d" % resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss, file=sys.stderr); sys.exit(rc)'
          CLEAN=0; TRIED=0; CLEAN_SEEDS=""
          for s in $SEEDS; do
            TRIED=$((TRIED+1))
            rm -f "$OUT/$TOP.fasm"
            t0=$(date +%s.%N)
            docker run --rm -v "$PWD:/work" -w /work "$IMG" timeout --signal=KILL 900 python3 -c "$RSS_WRAP" nextpnr-xilinx \
              --chipdb "/work/build/chipdb/$PART.bin" \
              --xdc "/work/specs/fpga/constraints/$XDC" \
              --json "/work/$OUT/$TOP.json" \
              --fasm "/work/$OUT/$TOP.fasm" \
              --freq 50.0 --seed "$s" --placer heap --router "$ROUTER" --timing-allow-fail > "/tmp/np_$s.log" 2>&1 || true
            dt=$(awk -v a="$t0" -v b="$(date +%s.%N)" 'BEGIN{printf "%d", b - a + 0.5}')
            fasm_written=false; [ -f "$OUT/$TOP.fasm" ] && fasm_written=true
            route_failed=false; grep -q "Failed to find a route" "/tmp/np_$s.log" && route_failed=true
            clean=false; [ "$fasm_written" = true ] && [ "$route_failed" = false ] && clean=true
            if [ "$clean" = true ]; then
              CLEAN=$((CLEAN+1)); CLEAN_SEEDS="$CLEAN_SEEDS $s"; why=clean
            else
              why=$(grep -m1 -E "^ERROR:|Failed to find a route|Assertion" "/tmp/np_$s.log" || echo "no fasm, no error line")
            fi
            fmax=$(awk '/Routing complete/{after=1; f=""} after && /Max frequency for clock/{f=$0} END{print f}' "/tmp/np_$s.log" | sed 's/^Info: *//; s/^Warning: *//')
            fmax_postroute=false; [ -n "$fmax" ] && fmax_postroute=true
            timers=$(grep -oE "(HeAP Placer Time: |Router[12] time )[0-9.]+s" "/tmp/np_$s.log" | sed 's/ Time: /=/; s/ time /=/' | tr '\n' ' ')
            rss_mb=$(grep -oE "^maxrss_kb=[0-9]+" "/tmp/np_$s.log" | awk -F= '{printf "%d", $2/1024}')
            fasm_sha=-; [ "$fasm_written" = true ] && fasm_sha=$(sha256sum "$OUT/$TOP.fasm" | cut -c1-16)
            echo "seed=$s ${dt}s $why | $fmax"
            echo "detail seed=$s router=$ROUTER fmax_postroute=$fmax_postroute rss_mb=$rss_mb fasm=$fasm_sha $timers"
            echo "- seed $s, ${dt} s: \`$why\` $fmax; rss ${rss_mb} MB; $timers" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "RESULT design=$DESIGN placer=heap/$ROUTER clean=$CLEAN/$TRIED seeds:$CLEAN_SEEDS"
          echo "**clean seeds: $CLEAN/$TRIED ($CLEAN_SEEDS )**" >> "$GITHUB_STEP_SUMMARY"
