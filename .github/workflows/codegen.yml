# Does the VIBEE/Zig codegen path build and generate?
#
# This gate installed Zig with `brew install zig` -- an UNPINNED dependency, so
# it built a tree written for Zig 0.15.x with whatever Homebrew shipped that
# morning, which is now 0.16.0. A toolchain fetched by name is not a pinned
# toolchain, the same way a dependency pinned to a branch is not pinned.
#
# 0.16 moved the filesystem, clocks, sleeping and subprocesses behind an
# explicit `Io` capability that must be threaded through call graphs. The tree
# has 4,973 call sites across 865 of its 2,249 Zig files that would need it,
# and no `Io` instance exists anywhere yet. That migration is a real project;
# pinning the toolchain the code was actually written for is the honest interim,
# and it is what .github/workflows/tri-build.yml already does.
#
# Ubuntu, not macOS: Zig 0.15.2 cannot link against current macOS SDKs -- it
# fails inside its own build runner there, before reaching project code.
#
# phi^2 + 1/phi^2 = 3 = TRINITY

name: Codegen Validation

on:
  push:
    branches: [main, ralph/dev-*, vibee-v5-production]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  ZIG_VERSION: '0.15.2'

jobs:
  validate:
    name: Validate VIBEE Codegen
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # the gitlink was unfetchable until recently; see README

      - name: Fetch Zig ${{ env.ZIG_VERSION }}
        run: |
          set -e
          curl -sSL --retry 3 -o zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> $GITHUB_PATH

      - name: zig version
        run: zig version

      # One question per step. The previous version asked "does it build and
      # generate and test" with a single exit code, so a compile error and a
      # codegen regression were the same red.
      - name: Does build.zig parse?
        run: |
          zig ast-check build.zig
          echo 'build.zig parses' >> $GITHUB_STEP_SUMMARY

      - name: Does the build graph load?
        run: |
          set -o pipefail
          zig build --help 2>&1 | tee graph.log | head -30

      # -Dci=true skips the GUI/raylib targets: that is what the option is for.
      # -freference-trace so a comptime error names this repository's line
      # rather than a line inside the standard library.
      - name: Does it compile?
        id: build
        run: |
          set -o pipefail
          zig build -Dci=true -freference-trace=12 2>&1 | tee build.log | tail -40

      - name: Where it stopped
        if: failure()
        run: |
          echo '### First errors' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E 'error:' build.log 2>/dev/null | head -15 >> $GITHUB_STEP_SUMMARY || \
            tail -20 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Distinct files with errors: $(grep -oE '^[^:]+\.zig' build.log 2>/dev/null | sort -u | wc -l)" >> $GITHUB_STEP_SUMMARY

      # The spec list is checked against the tree BEFORE generating. Three of
      # the seven specs this step used to name -- golden_chain,
      # llm_full_inference, vsa_swarm_agent -- are not in the tree, and the old
      # step would have died on the first missing one with a codegen error,
      # which reads as a compiler fault rather than a missing file.
      - name: Are the named specs present?
        run: |
          set -e
          missing=0
          for s in batch_processing ternary_mathematics flash_attention ternary_embeddings; do
            if [ -f "specs/tri/$s.vibee" ]; then
              echo "  present  $s"
            else
              echo "::error::specs/tri/$s.vibee is named by this workflow and absent from the tree"
              missing=$((missing+1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Does codegen produce compiling Zig?
        run: |
          set -e
          for s in batch_processing ternary_mathematics flash_attention ternary_embeddings; do
            echo "::group::$s"
            zig build vibee -- gen "specs/tri/$s.vibee"
            zig test "generated/$s.zig"
            echo "::endgroup::"
          done

      # This step was `continue-on-error: true`, which meant it could not fail
      # and so reported green while `zig build test` was erroring on six test
      # compilations. A step that cannot fail says nothing, and its tick is
      # indistinguishable from a real pass -- which is the exact defect this
      # repository's other gates were audited for on the same day.
      #
      # `set -o pipefail` so the exit code survives the pipe to tail; without
      # it the step reports tail's success no matter what zig did.
      # `| tail -40` kept the summary tree and threw away the compile errors
      # above it, so a red step said "3 artifacts failed" and not one word about
      # why. Keep the whole log, print the error lines specifically, and upload
      # it -- the summary is the least useful part of a failure.
      # zig prints `Build Summary` only when a step fails, so on the success path
      # the summary grep below matched nothing, exited 1, and `bash -e` failed a
      # step whose tests had all passed. Making this step able to fail had turned
      # it into a step that cannot pass -- the same defect wearing the opposite
      # sign, and the harder one to notice, because a permanently red check reads
      # as a permanently broken subject rather than as a broken check.
      #
      # `--summary all` so the line exists on both paths, and `|| true` on every
      # reporting command so reporting can never decide the verdict. The verdict
      # is decided in exactly one place: the explicit `exit 1`.
      - name: Do the tests pass?
        run: |
          set -o pipefail
          zig build test --summary all > test.log 2>&1 || {
            echo "### Test failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E 'error:|error!|failed:' test.log | head -30 | tee -a $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -oE 'Build Summary:.*' test.log | tee -a $GITHUB_STEP_SUMMARY || true
            exit 1
          }
          grep -oE 'Build Summary:.*' test.log | tee -a $GITHUB_STEP_SUMMARY || true

      - name: TODO stubs in generated code
        if: always()
        run: |
          N=$(grep -r "TODO: implement" generated/*.zig 2>/dev/null | wc -l | tr -d ' ')
          echo "### TODO stubs in generated code: $N" >> $GITHUB_STEP_SUMMARY
          if [ "$N" -gt 0 ]; then
            echo "::warning::$N TODO stub implementations in generated files"
            grep -r "TODO: implement" generated/*.zig 2>/dev/null | head -10 || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegen-logs
          path: |
            build.log
            graph.log
            test.log
          retention-days: 30

  count-patterns:
    name: Count Pattern Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Count Specs and Behaviors
        run: |
          SPECS=$(find specs/tri -name "*.vibee" 2>/dev/null | wc -l | tr -d ' ')
          BEHAVIORS=$(grep -rh "^  - name:" specs/tri/*.vibee 2>/dev/null | wc -l | tr -d ' ')
          IMPLEMENTATIONS=$(grep -rh "implementation: |" specs/tri/*.vibee 2>/dev/null | wc -l | tr -d ' ')
          echo "### VIBEE corpus" >> $GITHUB_STEP_SUMMARY
          echo "| | count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| specs | $SPECS |" >> $GITHUB_STEP_SUMMARY
          echo "| behaviors | $BEHAVIORS |" >> $GITHUB_STEP_SUMMARY
          echo "| with inline implementation | $IMPLEMENTATIONS |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$BEHAVIORS" ] && [ "$BEHAVIORS" -gt 0 ]; then
            COVERAGE=$((IMPLEMENTATIONS * 100 / BEHAVIORS))
            echo "| coverage | ${COVERAGE}% (aspiration 95%) |" >> $GITHUB_STEP_SUMMARY
            if [ "$COVERAGE" -lt 95 ]; then
              echo "::warning::Implementation coverage ${COVERAGE}% (${IMPLEMENTATIONS}/${BEHAVIORS}); tracked as coverage debt, non-blocking."
            fi
          fi

      # This step used to print a hardcoded
      #     echo "✅ llm_full_inference - 14 behaviors, 14 tests"
      # for two components whose spec files are NOT in this tree. A green tick
      # that is an `echo` is worse than no line at all: it reports a status
      # nothing measured. It now reads the tree and says what is actually there.
      - name: Production component specs — present or not
        run: |
          echo "### v5 production components" >> $GITHUB_STEP_SUMMARY
          echo "| spec | in tree | behaviors |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for s in llm_full_inference vsa_swarm_agent golden_chain; do
            f="specs/tri/$s.vibee"
            if [ -f "$f" ]; then
              n=$(grep -c "^  - name:" "$f" 2>/dev/null || echo 0)
              echo "| \`$s\` | yes | $n |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| \`$s\` | **no** | — |" >> $GITHUB_STEP_SUMMARY
            fi
          done
