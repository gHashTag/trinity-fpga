# THROWAWAY (exp/corpus-ab-main, exp/corpus-ab-fix): the #885 A/B.
# Both branches carry this file and tools/codegen_ab_pick.py unchanged; they
# differ in tools/codegen_corpus.zig and its baseline: main's 788, or #886's
# 769 (02b9958de drops 19 entries that never wrote a .zig). Four arms
# on one runner, each a separate `zig build codegen-corpus`:
#   1 plain tree
#   2 one extra clean spec sorting before specs/tri/phi_utils_multi.tri
#   3 a non-baseline spec before it cannot write its output
#   4 a baseline spec at an unsampled index cannot write its output
# An arm's red is recorded, not fatal. A setup step failing is fatal: the arm
# after it would measure a different tree.

name: Codegen Validation

on:
  workflow_dispatch:

env:
  ZIG_VERSION: '0.16.0'

jobs:
  ab:
    name: codegen-corpus A/B (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch Zig ${{ env.ZIG_VERSION }}
        run: |
          set -e
          curl -sSL --retry 3 -o zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> $GITHUB_PATH

      - name: zig version and CPU
        run: |
          zig version
          grep -m1 'model name' /proc/cpuinfo || true

      - name: arm 1 -- plain tree
        id: plain
        continue-on-error: true
        shell: bash
        run: zig build codegen-corpus 2>&1 | tee arm1.log

      - name: setup 2 -- extra clean spec
        shell: bash
        run: python3 tools/codegen_ab_pick.py extra | tee setup2.log

      - name: arm 2 -- extra clean spec before phi_utils_multi
        id: extra
        continue-on-error: true
        shell: bash
        run: zig build codegen-corpus 2>&1 | tee arm2.log

      - name: setup 3 -- non-baseline spec cannot write
        shell: bash
        run: |
          python3 tools/codegen_ab_pick.py unextra | tee setup3.log
          python3 tools/codegen_ab_pick.py nonbase-dir | tee -a setup3.log

      - name: arm 3 -- non-baseline spec before phi_utils_multi leaves no file
        id: nonbase
        continue-on-error: true
        shell: bash
        run: zig build codegen-corpus 2>&1 | tee arm3.log

      - name: setup 4 -- baseline spec cannot write
        shell: bash
        run: |
          python3 tools/codegen_ab_pick.py clear-dirs | tee setup4.log
          python3 tools/codegen_ab_pick.py base-dir | tee -a setup4.log

      - name: arm 4 -- baseline spec at an unsampled index leaves no file
        id: base
        continue-on-error: true
        shell: bash
        run: zig build codegen-corpus 2>&1 | tee arm4.log

      - name: summary
        shell: bash
        run: |
          echo "outcomes: plain=${{ steps.plain.outcome }} extra=${{ steps.extra.outcome }} nonbase=${{ steps.nonbase.outcome }} base=${{ steps.base.outcome }}"
          for n in 1 2 3 4; do
            echo "--- arm $n"
            cat setup$n.log 2>/dev/null || true
            grep -E 'DOES NOT COMPILE|NEW CLEAN|NO OUTPUT|REGRESSED|codegen corpus:|regressed,|compile sample|do not compile' arm$n.log || true
          done
