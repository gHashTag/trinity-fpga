# THROWAWAY (exp/codegen-flake-ab): determinism probe for #851 W15.
# main's codegen-corpus step was red on e6eac0900 (push) and green on the same
# SHA (schedule). This asks whether vibee_gen's output varies run to run.

name: Codegen Validation

on:
  workflow_dispatch:

env:
  ZIG_VERSION: '0.16.0'

jobs:
  validate:
    name: Validate VIBEE Codegen (determinism probe)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch Zig ${{ env.ZIG_VERSION }}
        run: |
          set -e
          curl -sSL --retry 3 -o zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> $GITHUB_PATH

      - name: Does any spec stop generating clean Zig?
        continue-on-error: true
        run: zig build codegen-corpus

      - name: Determinism probe 2 (no-output specs, 60 repeats, compile all baseline)
        env:
          REPEAT: '60'
          WORKERS: '4'
        run: python3 tools/codegen_determinism_probe2.py
