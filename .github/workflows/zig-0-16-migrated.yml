# Do the Zig 0.16 migrated files still compile?
#
# This repo is mid-migration and NEITHER toolchain builds the whole tree:
#
#   Zig 0.15.2  builds everything except the files already migrated to 0.16
#   Zig 0.16.0  builds those files and fails on ~20 targets still on 0.15 APIs
#
# So `tri builds` pins 0.15.2 (see its own header for why) and the migrated
# files are guarded out of it with `if (!ci_mode)` in build.zig. That guard is
# what keeps CI green -- and, on its own, it would mean the migrated files have
# no automated check at all. Each one would be verified once, by hand, by
# whoever migrated it, and never again.
#
# This job is the other half of that trade. It compiles every migrated file
# under a real 0.16 toolchain, so the guard moves the coverage instead of
# dropping it.
#
# The file list is DERIVED, never hand-maintained: `main(init: std.process.Init)`
# is the exact signature that 0.15.2 rejects, so grepping for it finds precisely
# the set that had to be guarded -- and the next file someone migrates is covered
# the moment it lands, with no list to remember to update.
#
# A derived list has one failure mode worth guarding against: if the pattern ever
# stops matching, the loop body runs zero times and the job passes green while
# checking nothing. So an empty result is a hard failure here, not a pass.
#
# phi^2 + 1/phi^2 = 3 = TRINITY

name: Zig 0.16 migrated files

on:
  push:
    paths:
      - 'src/**/*.zig'
      - '.github/workflows/zig-0-16-migrated.yml'
  pull_request:
    paths:
      - 'src/**/*.zig'
      - '.github/workflows/zig-0-16-migrated.yml'
  workflow_dispatch:

env:
  ZIG_VERSION: '0.16.0'

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # the gitlink is unfetchable; see README

      - name: Fetch Zig ${{ env.ZIG_VERSION }}
        run: |
          set -e
          # Note the arch-then-os ordering: zig-x86_64-linux-VERSION, not
          # zig-linux-x86_64-VERSION. The latter 404s.
          curl -sSL --retry 3 -o zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> $GITHUB_PATH

      - name: zig version
        run: zig version

      - name: Compile every migrated file
        run: |
          set -uo pipefail

          # while-read rather than `mapfile`: this was authored on a machine whose
          # only bash is 3.2, where mapfile does not exist. Shipping a construct
          # that could not be run before pushing is how CI-only breakage happens.
          files=()
          while IFS= read -r f; do files+=("$f"); done \
            < <(grep -rl --include='*.zig' 'std\.process\.Init' src/ | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Found no files matching 'std.process.Init'."
            echo "Either every file was migrated back off Zig 0.16, or the signature"
            echo "changed and this job is now checking nothing. Both need a human."
            exit 1
          fi

          echo "Checking ${#files[@]} migrated file(s) under Zig ${ZIG_VERSION}:"
          printf '  %s\n' "${files[@]}"
          echo

          mkdir -p /tmp/z16
          failed=()
          for f in "${files[@]}"; do
            name="$(basename "$f" .zig)"
            # Compile each file on its own rather than through build.zig: these
            # are standalone entry points, and build.zig cannot be evaluated by
            # 0.16 at all while the rest of the tree is still on 0.15 APIs.
            if zig build-exe "$f" -femit-bin="/tmp/z16/$name" > "/tmp/z16/$name.log" 2>&1; then
              echo "  ok    $f"
            else
              echo "  FAIL  $f"
              failed+=("$f")
            fi
          done

          # Report every failure, not just the first -- one broken file should not
          # hide the other nine.
          if [ "${#failed[@]}" -gt 0 ]; then
            echo
            echo "::error::${#failed[@]} of ${#files[@]} migrated file(s) no longer compile under Zig ${ZIG_VERSION}."
            for f in "${failed[@]}"; do
              echo "----- $f -----"
              tail -40 "/tmp/z16/$(basename "$f" .zig).log"
            done
            exit 1
          fi

          echo
          echo "All ${#files[@]} migrated file(s) compile under Zig ${ZIG_VERSION}."
