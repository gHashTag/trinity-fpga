# Experiment for #862 (S27), not a gate. In the gf14-sub build, yosys-abc dies on an assertion
# (Abc_LitIsCompl, "Lit >= 0", rc 134) inside &mfs during synth_xilinx's map_luts step. Yosys
# logs it and carries on: in main run 37212248879 it read back the mapping abc had written before
# &mfs (563 $lut cells) and synthesis finished. Whether that netlist still computes the RTL is not
# known. This proves it, or finds a counterexample, with Yosys's own equivalence checker.
#
# Method. One yosys session runs synth_xilinx in two halves, -run :map_luts and -run map_luts:, and
# writes the top module between them (pre: gate-level logic plus the already mapped FFs) and after
# them (post: the netlist the bitstream is built from). The abc call that crashes is in the second
# half, so pre against post covers it, and the first half's FSM recoding is on both sides.
#
# v3 changes the comparison. v2 used equiv_make -inames + equiv_simple + equiv_induct, and in run
# 37225893876 its positive controls failed (gf12_clean 114 unproven, gf14_add 120), so it could not
# prove even designs abc did not crash on. Its mutant control "passed" only because it was judged
# by unproven > 0: the mutant's 120 unproven points were the subject's own 120, so it was vacuous.
#
# v3 cuts every flip-flop out instead. All FFs are already FDCE/FDPE before map_luts and map_luts
# keeps their cell names (154/154 for gf14_add and gf14_sub, 146/146 for gf12_clean; the step
# checks it). FFCUT_PY replaces FF K with an input ffq_K that drives its old Q net and three
# outputs: ffns_K = CE ? D : Q, ffar_K = CLR or PRE, ffck_K = C. Both sides then go through the
# Xilinx simulation models (techmap -wb -D EQUIV -autoproc with +/xilinx/cells_sim.v), STARTUPE2
# is cut out with expose -evert (it has no SAT model; its pins become ports u_startup.<pin>), and
# miter -equiv + sat -prove-asserts checks every output and every FF's next state at once, for
# all inputs and all states. Same INIT, same clock, same async reset and same next state for
# every FF is sufficient for the two netlists to be sequentially equivalent; it is stronger than
# needed, so a "FAIL" here could be a false alarm, but a "SUCCESS" cannot be.
# -ignore_gold_x lets post refine an x of pre (pre has INIT 1'x, post 1'0). Inputs are 2-valued
# (-set-def-inputs): without it, x on an input gives a spurious counterexample (gold 1, gate x).
#
# Positive controls: gf12_clean and gf14_add, pre against post, must prove.
# Negative controls must end in a counterexample ("model found: FAIL!"), not in any non-zero exit:
# a port mismatch also exits 1 and proves nothing. Mutants change one LUT INIT in post: the first
# LUT6 inverted (v2's mutant), the LUT that drives u_add.result_packed[7] inverted and with only
# INIT bit 0 flipped, and the same inverted mutant in gf14_add. v2's cross-design control
# (gf14_sub pre against gf14_add post) is dropped: the two have different FF cell names, so the
# miter would stop on a port mismatch rather than find a counterexample.
# Also measured: whether the assertion fires in each of three one-shot gf14_sub runs and whether
# they give the same JSON; whether the split run gives the one-shot JSON, so that the netlist
# proven is the netlist CI builds; and whether the split run hits the assertion too.
#
# Last step, for an upstream report and for what the crash costs. Locally (Yosys 0.67, abc does
# not assert on this design) the same map_luts gives 380 LCs with &mfs and 435 without, so &mfs
# removes 12.6% of gf14_sub's LCs, and CI's 488 is a netlist without it. The step reruns map_luts
# from the pre netlist keeping abc's temp files, runs yosys-abc alone on them (a reproducer needs
# no Yosys if it asserts there too), and reruns with &mfs taken out of abc's script, which should
# give the split netlist byte for byte if the crash leaves exactly the &if mapping.
name: abc crash equivalence (experiment, #862)
on:
  push:
    branches: [exp/abc-equiv]
    paths: ['.github/workflows/exp-abc-equiv.yml']
env:
  IMG: regymm/openxc7@sha256:35c910739e3a4b40850b85de31ebc8954985a66e982009f09123b70dbb0e75da
  ADDER: fpga/openxc7-synth/gf_adder_param.v
  SYNTH: synth_xilinx -flatten -abc9 -nocarry -arch xc7
  SUB: gf14_sub_ax7203
  ADD: gf14_add_ax7203
  CLEAN: gf12_clean_ax7203
jobs:
  equiv:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            fpga/openxc7-synth
            fpga/vivado

      - name: Pull the pinned image
        shell: bash
        run: |
          exec > >(tee -a log.txt) 2>&1
          for i in 1 2 3 4 5 6; do
            t0=$(date +%s.%N)
            pulled=false; docker pull -q "$IMG" >/dev/null && pulled=true
            echo "TIMING pull attempt=$i ok=$pulled s=$(awk -v a="$t0" -v b="$(date +%s.%N)" 'BEGIN{printf "%.1f", b - a}')"
            if [ "$pulled" = true ]; then break; fi
            sleep $((i*20))
          done
          have_image=false; docker image inspect "$IMG" >/dev/null 2>&1 && have_image=true
          if [ "$have_image" = false ]; then echo "::error::cannot pull $IMG"; exit 1; fi
          echo "VERSION yosys=[$(docker run --rm "$IMG" yosys -V)]"
          echo "VERSION abc=[$(docker run --rm "$IMG" yosys-abc -c version 2>&1 | tr '\n' ' ')]"

      - name: One-shot synthesis, as CI does it
        shell: bash
        run: |
          exec > >(tee -a log.txt) 2>&1
          mkdir -p out
          oneshot() {  # tag top rtl
            printf '%s\n' "read_verilog $ADDER $3" "$SYNTH -top $2" "setundef -zero -params" "write_json out/$1.json" > "out/$1.ys"
            t0=$(date +%s.%N)
            rc=0; docker run --rm -v "$PWD:/work" -w /work "$IMG" timeout --signal=KILL 1200 yosys -s "out/$1.ys" > "out/$1.txt" 2>&1 || rc=$?
            s=$(awk -v a="$t0" -v b="$(date +%s.%N)" 'BEGIN{printf "%.1f", b - a}')
            asserts=$(grep -c "Assertion" "out/$1.txt" || true)
            sha=$(sha256sum "out/$1.json" 2>/dev/null | cut -d' ' -f1) || sha=missing
            lcs=$(awk '/Estimated number of LCs/{v=$NF} END{print v}' "out/$1.txt")
            echo "SYNTH tag=$1 top=$2 rc=$rc abc_asserts=$asserts lcs=$lcs json=$sha s=$s"
            first=$(grep -m 1 "Assertion" "out/$1.txt" | cut -c1-200) || first=""
            has_first=false; [ -n "$first" ] && has_first=true
            if [ "$has_first" = true ]; then echo "ABCMSG tag=$1 $first"; fi
            echo "$sha" >> "out/$2.shas"
          }
          for n in 1 2 3; do oneshot "sub$n" "$SUB" fpga/vivado/gf14_sub_ax7203.v; done
          oneshot add1 "$ADD" fpga/vivado/gf14_add_ax7203.v
          oneshot clean1 "$CLEAN" fpga/vivado/gf12_clean_ax7203.v
          distinct=$(sort -u "out/$SUB.shas" | wc -l)
          deterministic=false; [ "$distinct" -eq 1 ] && deterministic=true
          echo "DETERMINISM top=$SUB runs=3 distinct_json=$distinct deterministic=$deterministic"

      - name: Split synthesis, pre and post map_luts
        shell: bash
        run: |
          exec > >(tee -a log.txt) 2>&1
          split() {  # top rtl oneshot_tag
            printf '%s\n' "read_verilog $ADDER $2" \
              "$SYNTH -top $1 -run :map_luts" "select $1" "write_rtlil -selected out/$1-pre.il" "select -clear" \
              "$SYNTH -top $1 -run map_luts:" "setundef -zero -params" "write_json out/$1-split.json" \
              "select $1" "write_rtlil -selected out/$1-post.il" "select -clear" > "out/$1-split.ys"
            rc=0; docker run --rm -v "$PWD:/work" -w /work "$IMG" timeout --signal=KILL 1200 yosys -s "out/$1-split.ys" > "out/$1-split.txt" 2>&1 || rc=$?
            asserts=$(grep -c "Assertion" "out/$1-split.txt" || true)
            a=$(sha256sum "out/$3.json" 2>/dev/null | cut -d' ' -f1) || a=missing
            b=$(sha256sum "out/$1-split.json" 2>/dev/null | cut -d' ' -f1) || b=missing
            same=false; [ "$a" = "$b" ] && same=true
            pre_cells=$(grep -c '^  cell ' "out/$1-pre.il" || true)
            post_cells=$(grep -c '^  cell ' "out/$1-post.il" || true)
            echo "SPLIT top=$1 rc=$rc abc_asserts=$asserts same_json_as_oneshot=$same pre_cells=$pre_cells post_cells=$post_cells"
            echo "$asserts" > "out/$1.split-asserts"
          }
          split "$SUB" fpga/vivado/gf14_sub_ax7203.v sub1
          split "$ADD" fpga/vivado/gf14_add_ax7203.v add1
          split "$CLEAN" fpga/vivado/gf12_clean_ax7203.v clean1

      - name: Mutants for the negative controls
        shell: bash
        env:
          # POST -> MUT with one LUT's INIT changed. TARGET=first picks the first LUT6 (else the
          # widest LUT); any other TARGET is the text after "connect \O " of the LUT to change.
          # MODE=invert flips every INIT bit, MODE=bit0 flips only bit 0 (all inputs 0), which
          # can be an unreachable minterm -- a bit0 mutant that proves equal needs a look, not a
          # verdict.
          MUTATE_PY: |
            import os, re, sys
            src, dst = os.environ["POST"], os.environ["MUT"]
            target, mode = os.environ["TARGET"], os.environ["MODE"]
            lines = open(src).read().split("\n")
            first = {}
            current = None
            driver = None
            for i, line in enumerate(lines):
                m = re.match(r"\s*cell \\(LUT[1-6]) (\S+)$", line)
                is_lut = m is not None
                is_cell = line.startswith("  cell ")
                if is_cell:
                    current = (i, m.group(1), m.group(2)) if is_lut else None
                if is_lut:
                    first.setdefault(m.group(1), (i, m.group(2)))
                drives = current is not None and line.strip() == "connect \\O " + target
                if drives:
                    driver = current
            order = [t for t in ("LUT6", "LUT5", "LUT4", "LUT3", "LUT2", "LUT1") if t in first]
            by_order = target == "first" and bool(order)
            if by_order:
                driver = (first[order[0]][0], order[0], first[order[0]][1])
            have_lut = driver is not None
            if not have_lut:
                print(f"ANOMALY: no LUT for TARGET={target} in {src}")
                sys.exit(1)
            start, kind, name = driver
            before = after = None
            for j in range(start + 1, len(lines)):
                is_end = lines[j].strip() == "end"
                if is_end:
                    break
                m = re.match(r"(\s*parameter \\INIT )(\d+)'([01]+)$", lines[j])
                is_init = m is not None
                if is_init:
                    before = m.group(3)
                    inverted = mode == "invert"
                    flipped = before.translate(str.maketrans("01", "10"))
                    after = flipped if inverted else before[:-1] + flipped[-1]
                    lines[j] = f"{m.group(1)}{m.group(2)}'{after}"
                    break
            mutated = after is not None
            if not mutated:
                print(f"ANOMALY: {kind} {name} has no binary INIT parameter")
                sys.exit(1)
            open(dst, "w").write("\n".join(lines))
            print(f"MUTANT out={dst} target={target} mode={mode} cell={name} type={kind} init_before={before} init_after={after}")
        run: |
          exec > >(tee -a log.txt) 2>&1
          printf '%s\n' "$MUTATE_PY" > out/mutate.py
          R7='\u_add.result_packed [7]'
          POST="out/$SUB-post.il" MUT="out/$SUB-post-mut.il" TARGET=first MODE=invert python3 out/mutate.py
          POST="out/$SUB-post.il" MUT="out/$SUB-post-mreint.il" TARGET="$R7" MODE=invert python3 out/mutate.py
          POST="out/$SUB-post.il" MUT="out/$SUB-post-mbit.il" TARGET="$R7" MODE=bit0 python3 out/mutate.py
          POST="out/$ADD-post.il" MUT="out/$ADD-post-mut.il" TARGET="$R7" MODE=invert python3 out/mutate.py

      - name: Equivalence, subject and controls
        shell: bash
        env:
          # in.il out.il ffs.txt [ref.ffs]: every FDCE/FDPE K becomes input ffq_K, which drives
          # its old Q net, and outputs ffns_K = CE ? D : Q, ffar_K = CLR or PRE, ffck_K = C.
          # With ref.ffs (the gold side's list) it also checks that both sides have the same FF
          # names and types, and the same INIT wherever gold's INIT is not x. The miter cannot
          # see INIT or the FF type, because the FFs are gone, so this check carries them.
          FFCUT_PY: |
            import re, sys
            src, dst, ffs_out = sys.argv[1:4]
            lines = open(src).read().split("\n")
            out, ffs, other_seq = [], {}, []
            i, port = 0, 100000
            while i < len(lines):
                line = lines[i]
                m = re.match(r"^  cell \\(FDCE|FDPE) (\S+)$", line)
                is_ff = m is not None
                seq = re.match(r"^  cell (\\(FD|SRL|RAM|LD)\w*|\$\S*(dff|ff|dlatch|sr)\S*) ", line, re.I)
                is_other_seq = seq is not None and not is_ff
                if is_other_seq:
                    other_seq.append(line.strip())
                if not is_ff:
                    out.append(line)
                    i += 1
                    continue
                kind, name = m.groups()
                conn, par = {}, {}
                i += 1
                while lines[i] != "  end":
                    f = lines[i].split(None, 2)
                    is_conn = f[0] == "connect"
                    if is_conn:
                        conn[f[1][1:]] = f[2]
                    is_par = f[0] == "parameter"
                    if is_par:
                        par[f[1][1:]] = f[2]
                    i += 1
                i += 1
                init = par.pop("INIT", "none")
                rest = ",".join(f"{k}={v}" for k, v in sorted(par.items())) or "-"
                ffs[name] = (kind, init, rest)
                key = re.sub(r"[^A-Za-z0-9]", "_", name)
                q, ns, ar, ck = (f"\\ff{t}_{key}" for t in ("q", "ns", "ar", "ck"))
                reset = conn.get("CLR", conn.get("PRE"))
                out += [f"  wire width 1 input {port} {q}", f"  wire width 1 output {port + 1} {ns}",
                        f"  wire width 1 output {port + 2} {ar}", f"  wire width 1 output {port + 3} {ck}",
                        f"  cell $mux $ffcut_{key}", "    parameter \\WIDTH 1", f"    connect \\A {q}",
                        f"    connect \\B {conn['D']}", f"    connect \\S {conn['CE']}", f"    connect \\Y {ns}",
                        "  end", f"  connect {conn['Q']} {q}", f"  connect {ar} {reset}", f"  connect {ck} {conn['C']}"]
                port += 4
            open(dst, "w").write("\n".join(out))
            open(ffs_out, "w").write("".join(f"{n}\t{k}\t{v}\t{r}\n" for n, (k, v, r) in sorted(ffs.items())))
            bad = [f"other sequential cell: {c}" for c in other_seq]
            have_ref = len(sys.argv) > 4
            if have_ref:
                ref = {}
                for row in open(sys.argv[4]).read().splitlines():
                    n, k, v, r = row.split("\t")
                    ref[n] = (k, v, r)
                names_differ = set(ref) != set(ffs)
                if names_differ:
                    bad.append(f"FF names differ: {len(set(ref) - set(ffs))} only in gold, {len(set(ffs) - set(ref))} only in gate")
                for n in sorted(set(ref) & set(ffs)):
                    (rk, rv, rr), (k, v, r) = ref[n], ffs[n]
                    init_ok = rv == v or "x" in rv
                    same = rk == k and rr == r and init_ok
                    if not same:
                        bad.append(f"{n}: gold {rk} INIT={rv} {rr}, gate {k} INIT={v} {r}")
            print(f"FFCUT src={src} ffs={len(ffs)} ref={have_ref} problems={len(bad)}")
            for b in bad[:5]:
                print(f"FFCUT problem: {b}")
            failed = bool(bad) or len(ffs) == 0
            sys.exit(1 if failed else 0)
          # yosys sat -show-ports table -> DIFF lines for each miter output pair whose gold and
          # gate values differ, then COUNT <differing> <pairs>.
          CEX_PY: |
            import re, sys
            vals = {}
            for line in open(sys.argv[1], errors="replace"):
                m = re.match(r"^\s+\\(gold|gate)_(\S+)\s+\S+\s+\S+\s+(\S+)\s*$", line)
                is_row = m is not None
                if is_row:
                    vals[(m.group(1), m.group(2))] = m.group(3)
            names = sorted(n for s, n in vals if s == "gold" and ("gate", n) in vals)
            diff = [n for n in names if vals[("gold", n)] != vals[("gate", n)]]
            for n in diff:
                print(f"DIFF {n} gold={vals[('gold', n)]} gate={vals[('gate', n)]}")
            print(f"COUNT {len(diff)} {len(names)}")
        run: |
          exec > >(tee -a log.txt) 2>&1
          printf '%s\n' "$FFCUT_PY" > out/ffcut.py
          printf '%s\n' "$CEX_PY" > out/cex.py
          equiv() {  # case top gold_il gate_il expect(equal|differ)
            cut_ok=false
            python3 out/ffcut.py "$3" "out/eq-$1-gold.il" "out/eq-$1-gold.ffs" \
              && python3 out/ffcut.py "$4" "out/eq-$1-gate.il" "out/eq-$1-gate.ffs" "out/eq-$1-gold.ffs" \
              && cut_ok=true
            printf '%s\n' "read_verilog -lib +/xilinx/cells_xtra.v" \
              "read_rtlil out/eq-$1-gold.il" "rename $2 gold" "read_rtlil out/eq-$1-gate.il" "rename $2 gate" \
              "expose -evert t:STARTUPE2" "setundef -zero -params" \
              "techmap -wb -D EQUIV -autoproc -map +/xilinx/cells_sim.v" "opt_clean" \
              "miter -equiv -flatten -make_assert -make_outputs -ignore_gold_x gold gate miter" "hierarchy -top miter" \
              "sat -verify -prove-asserts -enable_undef -set-def-inputs -show-ports miter" > "out/eq-$1.ys"
            t0=$(date +%s.%N)
            rc=0; docker run --rm -v "$PWD:/work" -w /work "$IMG" timeout --signal=KILL 600 yosys -s "out/eq-$1.ys" > "out/eq-$1.txt" 2>&1 || rc=$?
            s=$(awk -v a="$t0" -v b="$(date +%s.%N)" 'BEGIN{printf "%.1f", b - a}')
            proved=false; grep -qF "no model found: SUCCESS!" "out/eq-$1.txt" && proved=true
            cex=false; grep -qF "model found: FAIL!" "out/eq-$1.txt" && cex=true
            python3 out/cex.py "out/eq-$1.txt" > "out/eq-$1.cex" || true
            ndiff=$(awk '/^COUNT/{print $2}' "out/eq-$1.cex"); ndiff=${ndiff:-0}
            nout=$(awk '/^COUNT/{print $3}' "out/eq-$1.cex"); nout=${nout:-0}
            want_equal=false; [ "$5" = equal ] && want_equal=true
            want_differ=false; [ "$5" = differ ] && want_differ=true
            pass=false
            [ "$want_equal" = true ] && [ "$cut_ok" = true ] && [ "$rc" -eq 0 ] && [ "$proved" = true ] && pass=true
            [ "$want_differ" = true ] && [ "$cut_ok" = true ] && [ "$cex" = true ] && [ "$ndiff" -gt 0 ] && pass=true
            echo "EQUIV case=$1 top=$2 rc=$rc ff_cut=$cut_ok proved=$proved counterexample=$cex differing_outputs=$ndiff/$nout expect=$5 pass=$pass s=$s"
            grep -m 3 '^DIFF' "out/eq-$1.cex" | sed "s/^/CEX case=$1 /" || true
            ev_gold=$(grep -c -E "New module port: [^ ]*gold/[^ ]*u_startup" "out/eq-$1.txt" || true)
            ev_gate=$(grep -c -E "New module port: [^ ]*gate/[^ ]*u_startup" "out/eq-$1.txt" || true)
            echo "EVERT case=$1 gold_ports=$ev_gold gate_ports=$ev_gate"
            uneven=false; [ "$ev_gold" -ne "$ev_gate" ] && uneven=true
            [ "$ev_gold" -eq 0 ] && uneven=true
            if [ "$uneven" = true ]; then echo "ANOMALY case=$1 STARTUPE2 was not cut the same way on both sides"; fi
            neither=false; [ "$proved" = false ] && [ "$cex" = false ] && neither=true
            if [ "$neither" = true ]; then echo "ANOMALY case=$1 sat gave neither a proof nor a counterexample"; tail -n 15 "out/eq-$1.txt"; fi
            echo "$pass" > "out/eq-$1.pass"
          }
          equiv subject      "$SUB"   "out/$SUB-pre.il"   "out/$SUB-post.il"        equal
          equiv pos-clean     "$CLEAN" "out/$CLEAN-pre.il" "out/$CLEAN-post.il"      equal
          equiv pos-add       "$ADD"   "out/$ADD-pre.il"   "out/$ADD-post.il"        equal
          equiv neg-mut-first "$SUB"   "out/$SUB-pre.il"   "out/$SUB-post-mut.il"    differ
          equiv neg-mut-r7    "$SUB"   "out/$SUB-pre.il"   "out/$SUB-post-mreint.il" differ
          equiv neg-mut-add   "$ADD"   "out/$ADD-pre.il"   "out/$ADD-post-mut.il"    differ
          equiv neg-mut-bit0  "$SUB"   "out/$SUB-pre.il"   "out/$SUB-post-mbit.il"   differ
          ok() { [ "$(cat "out/eq-$1.pass")" = true ]; }
          controls_ok=false
          ok pos-clean && ok pos-add && ok neg-mut-first && ok neg-mut-r7 && ok neg-mut-add && controls_ok=true
          bit0_caught=false; ok neg-mut-bit0 && bit0_caught=true
          echo "NOTE neg-mut-bit0 caught=$bit0_caught (reported, not a control: bit 0 of a LUT INIT can be unreachable)"
          subject_equivalent=false; ok subject && subject_equivalent=true
          crash_in_split=false; [ "$(cat "out/$SUB.split-asserts")" -gt 0 ] && crash_in_split=true
          echo "RESULT subject_equivalent=$subject_equivalent controls_ok=$controls_ok crash_in_split=$crash_in_split"
          if [ "$controls_ok" = false ]; then echo "::error::a control failed: the harness cannot be trusted, so the subject result means nothing"; exit 1; fi
          if [ "$crash_in_split" = false ]; then echo "::error::the split run did not hit the abc assertion, so the proof does not cover the crash"; exit 1; fi
          if [ "$subject_equivalent" = false ]; then echo "::error::gf14_sub after the abc crash is not proven equivalent to its pre-abc netlist"; exit 1; fi

      - name: Standalone abc reproducer and the cost of the missing &mfs
        if: always()
        shell: bash
        run: |
          exec > >(tee -a log.txt) 2>&1
          mapper() {  # tag abc-script-or-empty
            {
              printf '%s\n' "read_verilog -lib -specify +/xilinx/cells_sim.v" "read_verilog -lib +/xilinx/cells_xtra.v" "read_rtlil out/$SUB-pre.il" "hierarchy -top $SUB"
              has_script=false; [ -n "$2" ] && has_script=true
              if [ "$has_script" = true ]; then echo "scratchpad -set abc9.script $2"; fi
              printf '%s\n' "scratchpad -set abc9.nocleanup 1" "$SYNTH -top $SUB -run map_luts:" "setundef -zero -params" "write_json out/$SUB-$1.json"
            } > "out/abc-$1.ys"
            rc=0; docker run --rm -v "$PWD:/work" -w /work "$IMG" timeout --signal=KILL 600 yosys -s "out/abc-$1.ys" > "out/abc-$1.txt" 2>&1 || rc=$?
            asserts=$(grep -c "Assertion" "out/abc-$1.txt" || true)
            luts=$(awk '/ABC RESULTS: +\$lut cells:/{v=$NF} END{print v}' "out/abc-$1.txt")
            lcs=$(awk '/Estimated number of LCs/{v=$NF} END{print v}' "out/abc-$1.txt")
            a=$(sha256sum "out/$SUB-split.json" 2>/dev/null | cut -d' ' -f1) || a=missing
            b=$(sha256sum "out/$SUB-$1.json" 2>/dev/null | cut -d' ' -f1) || b=missing
            same=false; [ "$a" = "$b" ] && same=true
            echo "REPRO run=$1 rc=$rc abc_asserts=$asserts lut_cells=$luts lcs=$lcs same_json_as_split=$same"
          }
          # 1. From the written pre netlist, as split does, but keeping abc's temp files.
          mapper keep ""
          d=$(find . -maxdepth 1 -type d -name '_tmp_yosys-abc-*' -print -quit | sed 's#^\./##')
          found=false; [ -n "$d" ] && found=true
          if [ "$found" = true ]; then
            docker run --rm -v "$PWD:/work" -w /work "$IMG" chmod -R a+rwX "$d"
            mkdir -p out/abc-repro
            cp "$d/input.xaig" "$d/input.lut" "$d/input.box" "$d/abc.script" out/abc-repro/
            sed -e "s#/work/$d/##g" -e "s#$d/##g" "$d/abc.script" > out/abc-repro/repro.abc
            # 2. abc alone on those four files, no Yosys: is this a self-contained reproducer?
            rc=0; docker run --rm -v "$PWD:/work" -w /work/out/abc-repro "$IMG" sh -c 'exec timeout --signal=KILL 300 "$(dirname "$(command -v yosys)")/yosys-abc" -s -f repro.abc' > out/abc-repro/standalone.txt 2>&1 || rc=$?
            asserts=$(grep -c "Assertion" out/abc-repro/standalone.txt || true)
            echo "REPRO run=standalone rc=$rc abc_asserts=$asserts"
            sha256sum out/abc-repro/input.xaig out/abc-repro/input.lut out/abc-repro/input.box | sed 's/^/REPRO sha256 /'
          fi
          if [ "$found" = false ]; then echo "ANOMALY abc9.nocleanup left no _tmp_yosys-abc-* directory"; fi
          # 3. The same map_luts with &mfs removed from abc's script. If the crash leaves the &if
          #    mapping, this gives the split netlist byte for byte; 'nomfs' vs a working &mfs is
          #    what the crash costs, and that needs a build where &mfs does not assert.
          mapper nomfs '+&scorr;&sweep;&dc2;&dch,-f,-r;&ps;&if,-W,300,-v;&ps,-l'

      - name: Summary
        if: always()
        shell: bash
        run: |
          grep -h -E '^(TIMING|VERSION|SYNTH|ABCMSG|DETERMINISM|SPLIT|MUTANT|FFCUT|EQUIV|CEX|EVERT|NOTE|RESULT|REPRO|ANOMALY)' log.txt | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-abc-equiv
          path: |
            log.txt
            out/*.txt
            out/*.ys
            out/*.il
            out/*.ffs
            out/*.cex
            out/abc-repro/
          retention-days: 14
