# bitwalk on Linux x86_64: a probe for #848 (S5), not a gate.
#
# bitwalk is gHashTag/t27's specs/xilinx7/{packets,frames,far,flow}.t27, generated to Rust
# by t27c gen-rust plus a hand driver (bitwalk.rs). Until now it has only been built on one
# macOS laptop. This job builds it on a hosted runner from a pinned t27 commit, as a static
# musl binary so it also runs inside the openXC7 image and on Railway. It then runs it
# against prjxray's fasm2frames + xc7frames2bit on the same FASM, the same prjxray-db and the
# same runner, interleaved. The job fails unless the .frames are byte-identical and the .bit
# payloads (from the sync word on) match.
#
# The FASM is the blinky artifact of an earlier "AX7203 Blinky Bitstream" run, so no yosys or
# nextpnr runs here. That run's .bit is a third oracle.
#
# Arm d (memo) is an experiment on the --write path: the same driver with far.t27's fdri_index
# replaced per line by a table lookup, built from a patched copy in the runner. Its payload must
# also be byte-identical to xc7frames2bit's.
#
# Arm e (option 2 of gHashTag/t27#6348) keeps the driver and fdri_index unchanged and replaces
# far.t27's group_frames, which walks a group frame by frame, with the sum of COL_FRAMES over
# the group's columns. The change is made in a copy of far.t27 in the runner and generated by
# t27c, with the same payload rule. far.t27's own test blocks are run on the pinned spec, on
# option 2 and on a mutant of it through t27c test-report.
#
# Runs on a push to its own exp branch, because workflow_dispatch needs the file on main.

name: bitwalk Linux probe

on:
  push:
    branches: [exp/bitwalk-linux]
  workflow_dispatch:
    inputs:
      t27_sha:
        description: gHashTag/t27 commit to build bitwalk from
        required: false
      fasm_run:
        description: run id of an "AX7203 Blinky Bitstream" run with the ax7203-blinky-bitstream artifact
        required: false

permissions:
  contents: read
  actions: read

env:
  T27_SHA: ${{ inputs.t27_sha || '634b3ff26ee6a7d3781459b7d76ef4cd047c7220' }}
  FASM_RUN: ${{ inputs.fasm_run || '37212145640' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out gHashTag/t27 at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: gHashTag/t27
          ref: ${{ env.T27_SHA }}
          path: t27
          fetch-depth: 1

      - name: Build t27c
        working-directory: t27
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          s=$(date +%s%N)
          cargo build --release -p t27c 2>&1 | tail -3
          e=$(date +%s%N)
          echo "t27c build: $(( (e - s) / 1000000 )) ms"
          lock_moved=false
          git diff --quiet -- Cargo.lock || lock_moved=true
          echo "Cargo.lock changed by the build: $lock_moved"

      - name: Generate the xilinx7 specs to Rust and build bitwalk (static musl)
        working-directory: t27
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          s=$(date +%s%N)
          for spec in packets frames far flow; do
            ./target/release/t27c gen-rust "specs/xilinx7/$spec.t27" > "specs/xilinx7/$spec.rs"
          done
          g=$(date +%s%N)
          rustc -O --edition 2021 --target x86_64-unknown-linux-musl \
            specs/xilinx7/bitwalk.rs -o "$RUNNER_TEMP/bitwalk"
          e=$(date +%s%N)
          echo "gen-rust x4: $(( (g - s) / 1000000 )) ms, rustc: $(( (e - g) / 1000000 )) ms"
          file "$RUNNER_TEMP/bitwalk"
          # Run 37254020608 measured bitwalk --write 2x slower than xc7frames2bit here, against
          # 1.17x faster on a macOS laptop. The same source linked statically against glibc
          # separates the C library (musl malloc and memcpy) from the program. An arm that does
          # not build is reported and skipped, not fatal: the musl arm is the deliverable.
          gnu_built=false
          rustc -O --edition 2021 -C target-feature=+crt-static \
            specs/xilinx7/bitwalk.rs -o "$RUNNER_TEMP/bitwalk-gnu" && gnu_built=true
          if [ "$gnu_built" = true ]; then
            file "$RUNNER_TEMP/bitwalk-gnu"
          else
            echo "::warning::the static glibc arm did not build; only musl is timed"
          fi
          # Run 37255344733 timed --write on one line, half and all of the frames file (best of
          # 5): 30 ms, then +99 ms for the first half and +206 ms for the second. The cost per
          # line grows with the line position. By reading the code (an inference until this arm
          # is timed): write_bit calls w::fdri_index once per line, and fdri_index adds
          # group_frames(k) for every earlier group k, which counts a group by walking every one
          # of its frames, so a whole-part write is O(frames^2). The memo arm is the same driver
          # with that call replaced by a lookup in a table built once from walk_addresses, linked
          # like the glibc arm so the two differ only in the lookup. It is built from a patched
          # copy; the t27 sources are not changed. bitwalk-idx.rs is the unpatched driver plus a
          # test that the table is a drop-in: see the next step.
          patched=false
          python3 - specs/xilinx7/bitwalk.rs specs/xilinx7/bitwalk-memo.rs specs/xilinx7/bitwalk-idx.rs <<'PY' && patched=true
          import sys
          src = open(sys.argv[1]).read()
          loop = "    for line in std::fs::read_to_string(frames_path).unwrap().lines() {\n"
          call = "        let i = w::fdri_index(part, addr);\n"
          table = ("    let index: HashMap<u32, u32> = walk_addresses(part).iter().enumerate()\n"
                   "        .filter_map(|(i, a)| (*a).map(|a| (a, i as u32))).collect();\n")
          lookup = "        let i = *index.get(&addr).unwrap_or(&w::NO_FRAME);\n"
          for anchor in (loop, call):
              not_once = src.count(anchor) != 1
              if not_once:
                  sys.exit("memo patch: not exactly one match for: " + anchor.strip())
          open(sys.argv[2], "w").write(src.replace(loop, table + loop).replace(call, lookup))
          test = """
          #[cfg(test)]
          mod idx_check {
              use super::*;

              // Addresses fdri_index accepts in a part, counted from its own conditions: a group
              // of the part, a column below GROUP_COLS, a minor below that column COL_FRAMES.
              fn accepted(part: u32) -> usize {
                  let g0 = w::first_group(part);
                  let mut n = 0usize;
                  for g in g0..g0 + w::PART_GROUPS[part as usize] {
                      let first = w::first_column(g);
                      for c in 0..w::GROUP_COLS[g as usize] {
                          n += w::COL_FRAMES[(first + c) as usize] as usize;
                      }
                  }
                  n
              }

              #[test]
              fn fdri_index_is_the_walk_position() {
                  let (mut addrs, mut differ, mut repeated, mut unwalked, mut control) = (0usize, 0usize, 0usize, 0usize, 0usize);
                  for part in 0..w::PARTS {
                      let mut seen = HashSet::new();
                      let mut without_pads = 0u32;
                      for (i, a) in walk_addresses(part).iter().enumerate() {
                          let Some(a) = *a else { continue };
                          addrs += 1;
                          let again = !seen.insert(a);
                          if again { repeated += 1; }
                          let got = w::fdri_index(part, a);
                          let wrong = got != i as u32;
                          if wrong { differ += 1; }
                          // Negative control: the same position with the pad frames left out.
                          let control_wrong = got != without_pads;
                          if control_wrong { control += 1; }
                          without_pads += 1;
                      }
                      unwalked += accepted(part).abs_diff(seen.len());
                  }
                  println!("fdri_index against walk_addresses: {addrs} addresses over {} parts, {differ} differ, {repeated} repeated, {unwalked} accepted by fdri_index but not walked", w::PARTS);
                  println!("negative control, positions without the pad frames: {control} differ (must be > 0)");
                  assert!(differ == 0 && repeated == 0 && unwalked == 0, "fdri_index and walk_addresses disagree");
                  assert!(control > 0, "the check cannot see a wrong position");
              }

              // Option 2 of t27#6348 is a drop-in only if every group's walk count equals the
              // sum of COL_FRAMES over its columns. Run 37256265500 compared totals per part.
              #[test]
              fn group_frames_is_the_column_sum() {
                  let groups = w::first_group(w::PARTS);
                  let (mut differ, mut control) = (0u32, 0u32);
                  for g in 0..groups {
                      let first = w::first_column(g);
                      let cols = w::GROUP_COLS[g as usize];
                      let sum: u32 = (0..cols).map(|c| w::COL_FRAMES[(first + c) as usize]).sum();
                      let walked = w::group_frames(g);
                      let wrong = walked != sum;
                      if wrong { differ += 1; }
                      // Negative control: the same sum without the last column of the group.
                      let short: u32 = (0..cols.saturating_sub(1)).map(|c| w::COL_FRAMES[(first + c) as usize]).sum();
                      let control_wrong = walked != short;
                      if control_wrong { control += 1; }
                  }
                  println!("group_frames against the COL_FRAMES sum: {groups} groups, {differ} differ");
                  println!("negative control, the sum without the last column: {control} of {groups} differ (must be all)");
                  assert!(differ == 0, "group_frames is not the column sum");
                  assert!(control == groups, "the check cannot see a missing column");
              }
          }
          """
          open(sys.argv[3], "w").write(src + test)
          PY
          memo_built=false
          if [ "$patched" = true ]; then
            rustc -O --edition 2021 -C target-feature=+crt-static \
              specs/xilinx7/bitwalk-memo.rs -o "$RUNNER_TEMP/bitwalk-memo" && memo_built=true
          fi
          memo_src=""
          if [ "$memo_built" = true ]; then
            memo_src=specs/xilinx7/bitwalk-memo.rs
          else
            echo "::warning::the memo arm did not build; it is not timed"
          fi
          # Arm e: option 2 of t27#6348, made in the spec. Run 37257492583 timed it as a hand
          # patch of the generated far.rs; this arm patches a copy of far.t27 instead and lets
          # t27c generate the Rust, so what is timed is what the spec change would produce.
          # group_frames sums COL_FRAMES over the group's columns; the walk is kept as
          # group_frames_walked, and a new test block asserts the two agree on every group. A
          # second copy, opt2-mutant/, drops each group's last column: the next steps need it to
          # show that far.t27's own tests can see a wrong group_frames. bitwalk.rs reaches its
          # modules by #[path] next to itself, so the copy in opt2/ builds unchanged.
          opt2=false
          python3 - specs/xilinx7 specs/xilinx7/opt2 specs/xilinx7/opt2-mutant <<'PY2' && opt2=true
          import os, sys
          src_dir, out_dir, mut_dir = sys.argv[1], sys.argv[2], sys.argv[3]
          spec = open(os.path.join(src_dir, "far.t27")).read()
          head = ("// Frames group g carries, pads excluded, counted by walking it with far_next_in_row.\n"
                  "pub fn group_frames(g: u32) u32 {\n")
          not_once = spec.count(head) != 1
          if not_once:
              sys.exit("option 2 patch: not exactly one match for: " + head.splitlines()[1])
          start = spec.index(head)
          end = spec.index("\n}\n", start) + 3
          walked = spec[start:end].replace(head, (
              "// The same count by walking the group with far_next_in_row: the reference for the test\n"
              "// group_frames_is_the_walk.\n"
              "pub fn group_frames_walked(g: u32) u32 {\n"))
          def summed(bound):
              return ("// Frames group g carries, pads excluded: the sum of COL_FRAMES over its columns. Linear in\n"
                      "// columns where the walk was linear in frames; fdri_index calls this once per earlier\n"
                      "// group (gHashTag/t27#6348).\n"
                      "pub fn group_frames(g: u32) u32 {\n"
                      "    const first = first_column(g);\n"
                      "    var c : u32 = 0;\n"
                      "    var n : u32 = 0;\n"
                      "    while " + bound + " < GROUP_COLS[g] {\n"
                      "        n = n + COL_FRAMES[first + c];\n"
                      "        c = c + 1;\n"
                      "    }\n"
                      "    return n;\n"
                      "}\n")
          test = ("\n"
                  "// group_frames, the column sum, is the walk count for every group of every part.\n"
                  "test group_frames_is_the_walk {\n"
                  "    var g : u32 = 0;\n"
                  "    var same : u32 = 0;\n"
                  "    while g < first_group(PARTS) {\n"
                  "        const eq = group_frames(g) == group_frames_walked(g);\n"
                  "        if (eq) {\n"
                  "            same = same + 1;\n"
                  "        }\n"
                  "        g = g + 1;\n"
                  "    }\n"
                  "    assert g == 24;\n"
                  "    assert same == g;\n"
                  "}\n")
          tail_ok = spec.endswith("}\n")
          if not tail_ok:
              sys.exit("option 2 patch: far.t27 does not end with a closing brace and a newline")
          for out, bound in ((out_dir, "c"), (mut_dir, "c + 1")):
              os.makedirs(out, exist_ok=True)
              open(os.path.join(out, "far.t27"), "w").write(spec[:start] + summed(bound) + "\n" + walked + spec[end:] + test)
          print("option 2 patch: far.t27 lines", spec.count("\n", 0, start) + 1, "to", spec.count("\n", 0, end),
                "replaced; group_frames_walked kept; test group_frames_is_the_walk added; mutant in", mut_dir)
          PY2
          opt2_gen=false
          if [ "$opt2" = true ]; then
            ./target/release/t27c gen-rust specs/xilinx7/opt2/far.t27 > specs/xilinx7/opt2/far.rs && opt2_gen=true
          fi
          opt2_built=false
          if [ "$opt2_gen" = true ]; then
            sed -n 3p specs/xilinx7/opt2/far.rs
            sed -n '/^pub fn group_frames(/,/^}/p' specs/xilinx7/opt2/far.rs
            cp specs/xilinx7/packets.rs specs/xilinx7/frames.rs specs/xilinx7/flow.rs specs/xilinx7/bitwalk.rs specs/xilinx7/opt2/
            has_idx=false
            [ -f specs/xilinx7/bitwalk-idx.rs ] && has_idx=true
            if [ "$has_idx" = true ]; then cp specs/xilinx7/bitwalk-idx.rs specs/xilinx7/opt2/; fi
            rustc -O --edition 2021 -C target-feature=+crt-static \
              specs/xilinx7/opt2/bitwalk.rs -o "$RUNNER_TEMP/bitwalk-opt2" && opt2_built=true
          fi
          opt2_src=""
          if [ "$opt2_built" = true ]; then
            opt2_src="specs/xilinx7/opt2/far.t27 specs/xilinx7/opt2/far.rs specs/xilinx7/opt2-mutant/far.t27"
          else
            echo "::warning::the option 2 arm did not build; it is not timed"
          fi
          sha256sum specs/xilinx7/packets.t27 specs/xilinx7/frames.t27 specs/xilinx7/far.t27 \
            specs/xilinx7/flow.t27 specs/xilinx7/bitwalk.rs specs/xilinx7/fasm_digest.py $memo_src \
            specs/xilinx7/far.rs $opt2_src "$RUNNER_TEMP"/bitwalk* | tee "$RUNNER_TEMP/sha256.txt"

      # The memo arm is a drop-in for fdri_index only if the two agree on every address the walk
      # visits and the walk visits every address fdri_index accepts. Fatal: a disagreement would
      # be a far.t27 defect, not a timing result.
      - name: Check fdri_index against walk_addresses on every part
        working-directory: t27
        run: |
          set -euo pipefail
          no_source=true
          [ -f specs/xilinx7/bitwalk-idx.rs ] && no_source=false
          if [ "$no_source" = true ]; then
            echo "::warning::the patch did not apply, so there is no memo arm to check"
            echo "idx_check: not run, the patch did not apply" > "$RUNNER_TEMP/idx.txt"
            exit 0
          fi
          rustc -O --edition 2021 --test specs/xilinx7/bitwalk-idx.rs -o "$RUNNER_TEMP/idx_check"
          s=$(date +%s%N)
          "$RUNNER_TEMP/idx_check" --nocapture --test-threads=1 | tee "$RUNNER_TEMP/idx.txt"
          e=$(date +%s%N)
          echo "idx_check run: $(( (e - s) / 1000000 )) ms" | tee -a "$RUNNER_TEMP/idx.txt"
          # The same tests against option 2's far.rs. Not fatal: a disagreement there is a
          # defect of the proposal, not of far.t27, and the byte-compare still judges arm e.
          has_opt2=false
          [ -f specs/xilinx7/opt2/bitwalk-idx.rs ] && has_opt2=true
          if [ "$has_opt2" = true ]; then
            echo "--- option 2: far.rs with group_frames as a COL_FRAMES sum" | tee -a "$RUNNER_TEMP/idx.txt"
            opt2_compiled=false
            rustc -O --edition 2021 --test specs/xilinx7/opt2/bitwalk-idx.rs -o "$RUNNER_TEMP/idx_check_opt2" && opt2_compiled=true
            opt2_ok=false
            if [ "$opt2_compiled" = true ]; then
              s=$(date +%s%N)
              "$RUNNER_TEMP/idx_check_opt2" --nocapture --test-threads=1 | tee -a "$RUNNER_TEMP/idx.txt" && opt2_ok=true
              e=$(date +%s%N)
              echo "idx_check_opt2 run: $(( (e - s) / 1000000 )) ms" | tee -a "$RUNNER_TEMP/idx.txt"
            fi
            if [ "$opt2_ok" != true ]; then
              echo "::warning::option 2 fails the fdri_index checks" | tee -a "$RUNNER_TEMP/idx.txt"
            fi
          fi

      # far.t27's own test blocks. gen-rust does not lower them (line 3 of every generated .rs
      # says so), so they run only through t27c test-report, which generates Zig and runs each
      # test alone. Three specs: the pinned far.t27, option 2, and the option 2 mutant. Zig is
      # the version and the download t27's own xilinx7-l3-bench.yml uses. Not fatal: the lines
      # to read are each spec's pass and FAIL counts, and the mutant must show FAIL above 0.
      - name: far.t27 test blocks through t27c test-report (pinned, option 2, mutant)
        working-directory: t27
        env:
          ZIG_VERSION: "0.16.0"
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          export PATH="$RUNNER_TEMP/zig:$PATH"
          zig version
          for spec in specs/xilinx7/far.t27 specs/xilinx7/opt2/far.t27 specs/xilinx7/opt2-mutant/far.t27; do
            present=false
            [ -f "$spec" ] && present=true
            if [ "$present" = true ]; then
              s=$(date +%s%N)
              ./target/release/t27c test-report "$spec" --verbose 2>&1 | tee -a "$RUNNER_TEMP/test-report.txt" || true
              e=$(date +%s%N)
              echo "test-report $spec: $(( (e - s) / 1000000 )) ms" | tee -a "$RUNNER_TEMP/test-report.txt"
            else
              echo "test-report $spec: not present" | tee -a "$RUNNER_TEMP/test-report.txt"
            fi
          done

      - name: Download the blinky FASM and .bit
        uses: actions/download-artifact@v4
        with:
          name: ax7203-blinky-bitstream
          run-id: ${{ env.FASM_RUN }}
          github-token: ${{ github.token }}
          path: fasm

      - name: Pull openXC7 Docker image
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            echo "::warning::docker pull attempt $i failed, sleeping $((i*20))s"; sleep $((i*20))
          done
          docker image inspect --format "{{index .RepoDigests 0}}" regymm/openxc7:latest \
            | tee "$RUNNER_TEMP/image.txt"

      - name: bitwalk vs fasm2frames + xc7frames2bit, interleaved, 5 rounds
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$RUNNER_TEMP/bitwalk" out/bitwalk
          has_gnu=false
          [ -x "$RUNNER_TEMP/bitwalk-gnu" ] && has_gnu=true
          if [ "$has_gnu" = true ]; then cp "$RUNNER_TEMP/bitwalk-gnu" out/bitwalk-gnu; fi
          has_memo=false
          [ -x "$RUNNER_TEMP/bitwalk-memo" ] && has_memo=true
          if [ "$has_memo" = true ]; then cp "$RUNNER_TEMP/bitwalk-memo" out/bitwalk-memo; fi
          has_opt2=false
          [ -x "$RUNNER_TEMP/bitwalk-opt2" ] && has_opt2=true
          if [ "$has_opt2" = true ]; then cp "$RUNNER_TEMP/bitwalk-opt2" out/bitwalk-opt2; fi
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c '
            set -euo pipefail
            DB=/nextpnr-xilinx/xilinx/external/prjxray-db/artix7
            P=xc7a200tfbg484-2
            F=/work/fasm/blinky_ax7203.fasm
            O=/work/out
            echo "prjxray-db: $(git -C /nextpnr-xilinx/xilinx/external/prjxray-db rev-parse HEAD 2>/dev/null || echo unknown)"
            # Wall ms of one command, its output sent to the log. A failure is recorded in
            # failed.txt, because a command substitution inside echo would hide it from set -e.
            # 0 ms is printed as 1, because the speedup in flow.t27 (before / after) divides by it.
            # No apostrophes in this block: it is one single-quoted bash -c argument.
            ms() {
              local s e rc d failed
              s=$(date +%s%N); rc=0; "$@" >&2 || rc=$?; e=$(date +%s%N)
              failed=false; [ "$rc" -ne 0 ] && failed=true
              if [ "$failed" = true ]; then echo "rc=$rc: $*" >> /work/out/failed.txt; fi
              d=$(( (e - s) / 1000000 )); echo $(( d < 1 ? 1 : d ))
            }
            echo "digest $(ms sh -c "python3 /work/t27/specs/xilinx7/fasm_digest.py $DB $P > $O/db.digest") ms, $(wc -l < $O/db.digest) lines"
            source /prjxray/env/bin/activate
            : > $O/runs-fasm.txt
            : > $O/runs-write.txt
            has_gnu=false; [ -x $O/bitwalk-gnu ] && has_gnu=true
            # The memo arm only changes --write, so it reads the frames fasm2frames wrote.
            has_memo=false; [ -x $O/bitwalk-memo ] && has_memo=true
            has_opt2=false; [ -x $O/bitwalk-opt2 ] && has_opt2=true
            X2B=/prjxray/build/tools/xc7frames2bit
            PF="--part_file $DB/$P/part.yaml --part_name $P"
            for i in 1 2 3 4 5; do
              echo "blinky.fasm fasm2frames $(ms fasm2frames --db-root $DB --part $P $F $O/a$i.frames)" >> $O/runs-fasm.txt
              echo "blinky.fasm bitwalk $(ms $O/bitwalk --fasm $O/db.digest $F $O/b$i.frames)" >> $O/runs-fasm.txt
              if [ "$has_gnu" = true ]; then
                echo "blinky.fasm bitwalk-gnu $(ms $O/bitwalk-gnu --fasm $O/db.digest $F $O/c$i.frames)" >> $O/runs-fasm.txt
              fi
              echo "blinky.frames xc7frames2bit $(ms $X2B $PF --frm_file $O/a$i.frames --output_file $O/a$i.bit)" >> $O/runs-write.txt
              echo "blinky.frames bitwalk $(ms $O/bitwalk --write $O/b$i.frames $O/b$i.bit $PF)" >> $O/runs-write.txt
              if [ "$has_gnu" = true ]; then
                echo "blinky.frames bitwalk-gnu $(ms $O/bitwalk-gnu --write $O/c$i.frames $O/c$i.bit $PF)" >> $O/runs-write.txt
              fi
              if [ "$has_memo" = true ]; then
                echo "blinky.frames bitwalk-memo $(ms $O/bitwalk-memo --write $O/a$i.frames $O/d$i.bit $PF)" >> $O/runs-write.txt
              fi
              if [ "$has_opt2" = true ]; then
                echo "blinky.frames bitwalk-opt2 $(ms $O/bitwalk-opt2 --write $O/a$i.frames $O/e$i.bit $PF)" >> $O/runs-write.txt
              fi
            done
            cat $O/runs-fasm.txt $O/runs-write.txt
            any_failed=false; [ -s $O/failed.txt ] && any_failed=true
            if [ "$any_failed" = true ]; then echo "commands that failed:"; cat $O/failed.txt; exit 1; fi
            # Fixed cost against reading cost: the same writers on the first line of the frames file
            # and on its first half. Every writer still walks every frame of the part for ECC and
            # output, so what grows with the line count is the parsing. Informational: a writer
            # that refuses a short file is reported, not fatal, since the rounds above are the test.
            head -n 1 $O/a1.frames > $O/one.frames
            head -n $(( $(wc -l < $O/a1.frames) / 2 )) $O/a1.frames > $O/half.frames
            : > $O/runs-size.txt
            for i in 1 2 3 4 5; do
              for size in one half; do
                echo "$size.frames xc7frames2bit $(ms $X2B $PF --frm_file $O/$size.frames --output_file $O/$size-a$i.bit)" >> $O/runs-size.txt
                echo "$size.frames bitwalk $(ms $O/bitwalk --write $O/$size.frames $O/$size-b$i.bit $PF)" >> $O/runs-size.txt
                if [ "$has_gnu" = true ]; then
                  echo "$size.frames bitwalk-gnu $(ms $O/bitwalk-gnu --write $O/$size.frames $O/$size-c$i.bit $PF)" >> $O/runs-size.txt
                fi
                if [ "$has_memo" = true ]; then
                  echo "$size.frames bitwalk-memo $(ms $O/bitwalk-memo --write $O/$size.frames $O/$size-d$i.bit $PF)" >> $O/runs-size.txt
                fi
                if [ "$has_opt2" = true ]; then
                  echo "$size.frames bitwalk-opt2 $(ms $O/bitwalk-opt2 --write $O/$size.frames $O/$size-e$i.bit $PF)" >> $O/runs-size.txt
                fi
              done
            done
            echo "--- writers on the first line and the first half of the frames file"
            cat $O/runs-size.txt
            size_ok=true; [ -s $O/failed.txt ] && size_ok=false
            if [ "$size_ok" != true ]; then echo "::warning::a writer failed on a short frames file"; cat $O/failed.txt; fi
            # One more pass of each writer under the bash time keyword, outside the timed rounds:
            # user against sys time tells computation (parsing, the ECC loop) from page faults
            # and allocator traffic.
            TIMEFORMAT="%R s real, %U s user, %S s sys"
            : > $O/split.txt
            { echo -n "xc7frames2bit: "; { time $X2B $PF --frm_file $O/a1.frames --output_file $O/s-a.bit > /dev/null 2>&1; } 2>&1; } >> $O/split.txt
            { echo -n "bitwalk musl --write: "; { time $O/bitwalk --write $O/b1.frames $O/s-b.bit $PF > /dev/null 2>&1; } 2>&1; } >> $O/split.txt
            { echo -n "bitwalk musl --fasm: "; { time $O/bitwalk --fasm $O/db.digest $F $O/s-b.frames > /dev/null 2>&1; } 2>&1; } >> $O/split.txt
            if [ "$has_gnu" = true ]; then
              { echo -n "bitwalk glibc --write: "; { time $O/bitwalk-gnu --write $O/c1.frames $O/s-c.bit $PF > /dev/null 2>&1; } 2>&1; } >> $O/split.txt
            fi
            if [ "$has_memo" = true ]; then
              { echo -n "bitwalk glibc memo --write: "; { time $O/bitwalk-memo --write $O/a1.frames $O/s-d.bit $PF > /dev/null 2>&1; } 2>&1; } >> $O/split.txt
            fi
            if [ "$has_opt2" = true ]; then
              { echo -n "bitwalk glibc option 2 --write: "; { time $O/bitwalk-opt2 --write $O/a1.frames $O/s-e.bit $PF > /dev/null 2>&1; } 2>&1; } >> $O/split.txt
            fi
            if [ "$size_ok" = true ]; then
              { echo -n "xc7frames2bit, one line: "; { time $X2B $PF --frm_file $O/one.frames --output_file $O/s-one-a.bit > /dev/null 2>&1; } 2>&1; } >> $O/split.txt
              { echo -n "bitwalk musl --write, one line: "; { time $O/bitwalk --write $O/one.frames $O/s-one-b.bit $PF > /dev/null 2>&1; } 2>&1; } >> $O/split.txt
              if [ "$has_gnu" = true ]; then
                { echo -n "bitwalk glibc --write, one line: "; { time $O/bitwalk-gnu --write $O/one.frames $O/s-one-c.bit $PF > /dev/null 2>&1; } 2>&1; } >> $O/split.txt
              fi
              if [ "$has_memo" = true ]; then
                { echo -n "bitwalk glibc memo --write, one line: "; { time $O/bitwalk-memo --write $O/one.frames $O/s-one-d.bit $PF > /dev/null 2>&1; } 2>&1; } >> $O/split.txt
              fi
              if [ "$has_opt2" = true ]; then
                { echo -n "bitwalk glibc option 2 --write, one line: "; { time $O/bitwalk-opt2 --write $O/one.frames $O/s-one-e.bit $PF > /dev/null 2>&1; } 2>&1; } >> $O/split.txt
              fi
            fi
            echo "--- user and sys time, one pass each"
            cat $O/split.txt
            echo "frames file: $(wc -c < $O/a1.frames) bytes, $(wc -l < $O/a1.frames) lines"
            echo "--- flow.t27 verdicts (bitwalk --flow-runs)"
            $O/bitwalk --flow-runs $O/runs-fasm.txt --ref fasm2frames
            $O/bitwalk --flow-runs $O/runs-write.txt --ref xc7frames2bit
            $O/bitwalk --flow-runs $O/runs-size.txt --ref xc7frames2bit
          '

      - name: Byte-compare
        run: |
          set -euo pipefail
          payload() { python3 -c 'import sys, hashlib; b = open(sys.argv[1], "rb").read(); i = b.find(bytes.fromhex("aa995566")); print(hashlib.sha256(b[i:]).hexdigest() if i >= 0 else "no-sync-word")' "$1"; }
          ok=true
          for i in 1 2 3 4 5; do
            pa=$(payload "out/a$i.bit")
            for arm in b c; do
              arm_ran=false
              [ -f "out/$arm$i.bit" ] && arm_ran=true
              if [ "$arm_ran" != true ]; then continue; fi
              same_frames=false
              cmp -s "out/a$i.frames" "out/$arm$i.frames" && same_frames=true
              pb=$(payload "out/$arm$i.bit")
              same_payload=false
              [ "$pa" = "$pb" ] && same_payload=true
              echo "round $i arm $arm: frames identical $same_frames, payload identical $same_payload ($pa)"
              round_bad=false
              [ "$same_frames" = true ] && [ "$same_payload" = true ] || round_bad=true
              if [ "$round_bad" = true ]; then ok=false; fi
            done
            # Arms d and e wrote from fasm2frames output, so only their payload is compared.
            for arm in d e; do
              arm_ran=false
              [ -f "out/$arm$i.bit" ] && arm_ran=true
              if [ "$arm_ran" != true ]; then continue; fi
              pw=$(payload "out/$arm$i.bit")
              same_write=false
              [ "$pa" = "$pw" ] && same_write=true
              echo "round $i arm $arm: payload identical $same_write (frames from fasm2frames)"
              if [ "$same_write" != true ]; then ok=false; fi
            done
          done
          po=$(payload fasm/blinky_ax7203.bit)
          pb=$(payload out/b1.bit)
          same_as_artifact=false
          [ "$po" = "$pb" ] && same_as_artifact=true
          echo "bitwalk payload vs run $FASM_RUN's .bit: identical $same_as_artifact"
          # The short files are informational: a disagreement there is reported, not fatal.
          : > out/size-compare.txt
          for size in one half; do
            for arm in b c d e; do
              both_ran=false
              [ -f "out/$size-a1.bit" ] && [ -f "out/$size-${arm}1.bit" ] && both_ran=true
              if [ "$both_ran" != true ]; then continue; fi
              same_short=false
              [ "$(payload "out/$size-a1.bit")" = "$(payload "out/$size-${arm}1.bit")" ] && same_short=true
              echo "$size.frames arm $arm: payload identical to xc7frames2bit $same_short" | tee -a out/size-compare.txt
              if [ "$same_short" != true ]; then echo "::warning::$size.frames arm $arm differs from xc7frames2bit"; fi
            done
          done
          {
            echo "## bitwalk on Linux x86_64 (t27 $T27_SHA)"
            echo
            echo '```'
            echo "image $(cat "$RUNNER_TEMP/image.txt")"
            cat "$RUNNER_TEMP/sha256.txt"
            cat "$RUNNER_TEMP/idx.txt"
            cat out/runs-fasm.txt out/runs-write.txt
            cat out/runs-size.txt
            cat out/size-compare.txt
            cat out/split.txt
            echo "byte-identical in all 5 rounds, every arm (b musl, c glibc, d glibc memo, e glibc option 2): $ok; payload equals run $FASM_RUN's .bit: $same_as_artifact"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ok" != true ]; then
            echo "::error::bitwalk and prjxray disagree"
            exit 1
          fi

      # Kept as a workflow artifact only, so a Railway or CI job can fetch the exact binary that
      # was byte-compared here instead of rebuilding t27c (53-75 s cold).
      - name: Keep the bitwalk binaries, their sha256 and the image digest
        uses: actions/upload-artifact@v4
        with:
          name: bitwalk-linux-x86_64
          path: |
            ${{ runner.temp }}/bitwalk
            ${{ runner.temp }}/bitwalk-gnu
            ${{ runner.temp }}/bitwalk-memo
            ${{ runner.temp }}/bitwalk-opt2
            ${{ runner.temp }}/idx.txt
            ${{ runner.temp }}/test-report.txt
            ${{ runner.temp }}/sha256.txt
            ${{ runner.temp }}/image.txt
          retention-days: 14
