name: AX7203 Corona Decode TAKUM64
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fpga/openxc7-synth/corona_decode_takum64_ax7203.v'
      - 'fpga/openxc7-synth/takum64_decode.v'
      - 'fpga/openxc7-synth/corona_decode_ax7203.xdc'
      - '.github/workflows/ax7203-corona-decode-takum64.yml'
jobs:
  bitstream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Docker pull regymm/openxc7 (retry on transient 5xx)
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            echo "::warning::docker pull attempt $i failed, sleeping $((i*20))s"; sleep $((i*20))
          done
          docker image inspect regymm/openxc7:latest >/dev/null 2>&1 || { echo "::error::docker pull failed after 6 retries"; exit 1; }
      - name: Yosys
        run: |
          mkdir -p build/corona_decode_takum64
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 yosys -p "
            read_verilog fpga/openxc7-synth/corona_decode_takum64_ax7203.v fpga/openxc7-synth/takum64_decode_pipelined.v;
            synth_xilinx -flatten -abc9 -nocarry -nodsp -arch xc7 -top corona_decode_takum64_ax7203;
            setundef -zero -params; write_json build/corona_decode_takum64/corona_decode_ax7203.json" 2>&1 | tee /tmp/yosys.log
          grep -E "Estimated|ERROR" /tmp/yosys.log
      - uses: actions/cache@v4
        id: chipdb
        with:
          path: build/corona_decode_takum64/chipdb/xc7a200tfbg484-2.bin
          key: chipdb-xc7a200tfbg484-2-regymm-${{ github.run_id }}
          restore-keys: chipdb-xc7a200tfbg484-2-regymm-
      - if: steps.chipdb.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/corona_decode_takum64/chipdb
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c "cd /nextpnr-xilinx && python3 xilinx/python/bbaexport.py --device xc7a200tfbg484-2 --bba /work/build/corona_decode_takum64/chipdb/xc7a200tfbg484-2.bba && bbasm -l /work/build/corona_decode_takum64/chipdb/xc7a200tfbg484-2.bba /work/build/corona_decode_takum64/chipdb/xc7a200tfbg484-2.bin"
      - name: nextpnr (seed search, heap+sa x8)
        run: |
          CLEAN=0
          for placer in heap sa; do for s in $(seq 1 4); do
            rm -f build/corona_decode_takum64/corona_decode_ax7203.fasm
            # per-seed 30min timeout -- nextpnr can hang on BRAM+wide-multiply
            # netlists. The timeout must be INSIDE the container with --signal=KILL:
            # wrapping 'docker run' on the host sends SIGTERM that docker doesn't
            # propagate to nextpnr, so the hang never breaks (root cause of the
            # 6h+ stuck runs on commits 5b6878eb..). SIGKILL on nextpnr directly
            # is the only reliable kill.
            docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 timeout --signal=KILL 1800 nextpnr-xilinx \
              --chipdb /work/build/corona_decode_takum64/chipdb/xc7a200tfbg484-2.bin \
              --xdc /work/fpga/openxc7-synth/corona_decode_ax7203.xdc \
              --json /work/build/corona_decode_takum64/corona_decode_ax7203.json \
              --write /work/build/corona_decode_takum64/corona_decode_ax7203_routed.json \
              --fasm /work/build/corona_decode_takum64/corona_decode_ax7203.fasm \
              --freq 50.0 --seed $s --placer $placer --router router1 --timing-allow-fail > /tmp/np_${placer}_$s.log 2>&1 || true
            if grep -q "Failed to find a route" /tmp/np_${placer}_$s.log || [ ! -f build/corona_decode_takum64/corona_decode_ax7203.fasm ]; then continue; fi
            cp /tmp/np_${placer}_$s.log /tmp/np.log; CLEAN="$placer/$s"; break 2
          done; done
          [ "$CLEAN" = "0" ] && { echo "::error::no clean seed"; exit 1; }; echo "seed=$CLEAN"
      - name: fasm2bit
        run: |
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c "
            source /prjxray/env/bin/activate && fasm2frames --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 --part xc7a200tfbg484-2 /work/build/corona_decode_takum64/corona_decode_ax7203.fasm /work/build/corona_decode_takum64/corona_decode_ax7203.frames && /prjxray/build/tools/xc7frames2bit --part_file /nextpnr-xilinx/xilinx/external/prjxray-db/artix7/xc7a200tfbg484-2/part.yaml --part_name xc7a200tfbg484-2 --frm_file /work/build/corona_decode_takum64/corona_decode_ax7203.frames --output_file /work/build/corona_decode_takum64/corona_decode_ax7203.bit"
      - uses: actions/upload-artifact@v4
        with: {name: corona-decode-takum64-bitstream, path: build/corona_decode_takum64/corona_decode_ax7203.bit}
