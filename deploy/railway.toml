# Railway Deployment Configuration for Trinity MCP Server
# φ² + 1/φ² = 3 = TRINITY

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
# No startCommand key: Railway then uses the Dockerfile ENTRYPOINT.
# Do NOT write `startCommand = null` -- TOML has no null type, so that is a
# parse error and the deployment fails before any build, reporting only
# "does not have an associated build".
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
type = "web"
name = "trinity-mcp"
env = "PORT"
forwardedPorts = [8899]
